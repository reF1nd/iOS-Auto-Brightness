# Configuration keys and defaults. The brightness
# curve itself is the system's (HyperOS logical nits on this ROM).
# Saved changes are applied by the daemon within 5 s.

# Response
alpha_fast=0.45
alpha_mid=0.20
alpha_slow=0.06
fast_threshold=1.0
slow_threshold=0.05
spike_up=15.0
spike_down=0.05
hyst_low=0.025
hyst_high=0.03

# Reference learning gamma; unused, drags are learned the way HyperOS does
manual_gamma=2.2

# Sunlight mode (limited by max_brightness, temperature and battery)
high_lux_threshold=15000.0
high_lux_boost_max=0.35
high_lux_min_pct=0.90
high_lux_duration_ms=8000

# Not in the reference: learn slider drags into the system's three anchors;
# system dual sensor policy
learning_enabled=1
dual_sensor=1

# Log rotation (service.sh)
log_max_bytes=1048576
log_max_backups=2
