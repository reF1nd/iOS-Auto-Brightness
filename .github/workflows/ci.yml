name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inspect:
    name: Repository and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_core: ${{ steps.core.outputs.has_core }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check repository contents
        run: |
          for file in README.md LICENSE CONTRIBUTING.md docs/PLAN.md; do
            test -s "$file"
          done
          if git ls-files -- '*.zip' '*.apk' '*.jks' '*.keystore' '*.img' | grep -q .; then
            echo 'Reference packages, binary releases and signing material must not be tracked.' >&2
            exit 1
          fi
          git diff --check
      - name: Validate workflows with pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$tool_dir/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tool_dir/$archive" | sha256sum --check
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color
      - name: Detect core implementation
        id: core
        run: |
          if [[ -f CMakeLists.txt ]]; then
            echo 'has_core=true' >> "$GITHUB_OUTPUT"
            echo '### Native core: build and test enabled' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_core=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Bootstrap only — native core not implemented'
              echo 'Host tests and Android builds are skipped. No module has been built or tested.'
              echo 'Adding the root CMakeLists.txt enables both jobs; see CONTRIBUTING.md.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Host core tests
    needs: inspect
    if: needs.inspect.outputs.has_core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure test build
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build tests
        run: cmake --build build/host --parallel 2
      - name: Run tests (empty test suite is an error)
        run: ctest --test-dir build/host --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Check native memory and undefined behavior
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/sanitized -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build/sanitized --parallel 2
          ctest --test-dir build/sanitized --output-on-failure --no-tests=error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: host-test-results
          path: build/host/test-results.xml
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android ${{ matrix.abi }} build
    needs: [inspect, test]
    if: needs.inspect.outputs.has_core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    env:
      ABI: ${{ matrix.abi }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"'
      - name: Configure Android build
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/android/bin"
      - name: Build Android core
        run: cmake --build build/android --parallel 2
      - name: Inspect Android binary
        run: |
          binary=build/android/bin/ios_brightness_daemon
          test -s "$binary"
          "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$binary"
          sha256sum "$binary" > "$binary.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-auto-brightness-android-${{ matrix.abi }}
          path: build/android/bin/ios_brightness_daemon*
          if-no-files-found: error
          retention-days: 14

  bridge:
    name: Android framework bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile framework bridge
        run: bash tools/build-bridge.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-framework-bridge
          path: build/bridge/bridge.jar
          if-no-files-found: error

  emulator:
    name: Android ${{ matrix.api }} runtime smoke
    needs: [android, bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    env:
      EMULATOR_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ios-auto-brightness-android-x86_64
          path: build/artifacts/core
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: android-framework-bridge
          path: build/artifacts/bridge
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Start bridge in observation mode on stock Android
        run: bash tools/emulator-smoke.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: emulator-${{ matrix.api }}-diagnostics
          path: |
            build/smoke-*.json
            build/smoke-*.log
            build/emulator.log
          if-no-files-found: warn

  package:
    name: Root module package
    needs: [inspect, test, android, bridge, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ios-auto-brightness-android-*
          path: build/artifacts/core
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: android-framework-bridge
          path: build/artifacts/bridge
      - name: Check module scripts and WebUI syntax
        run: |
          shellcheck --severity=warning module/*.sh
          node --check module/webroot/app.js
          node --test tests/webui_test.mjs
      - name: Package and validate archive
        run: python3 tools/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kernelsu-module
          path: dist/*
          if-no-files-found: error
          retention-days: 30
